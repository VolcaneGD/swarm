interface:
  display_name: "Swarm CLI"
  short_description: "Use Swarm conversations through its local CLI"
  default_prompt: "Use $swarm-cli to read and search my registered Swarm project with the supplied CLI path, data root and session alias. Read each Thread description as both context and possible Thread-local rules every time it is opened. Permissions and RULES.md take precedence; explicitly confirm current rules before any later authorized write."
policy:
  allow_implicit_invocation: true
