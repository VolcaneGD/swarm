[workspace]
members = ["crates/swarm-core", "crates/swarm-platform", "crates/swarm-ipc", "crates/swarm-adapter", "crates/swarm-runtime", "crates/swarm-cli", "crates/swarm-gui-host", "crates/swarm-reports", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "1.3"
rusqlite = { version = "0.37", features = ["bundled", "backup", "serialize"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
sha2 = "0.10"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
jsonwebtoken = "9"
base64 = "0.22"
url = "2"
