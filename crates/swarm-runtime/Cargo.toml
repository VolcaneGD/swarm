[package]
name = "swarm-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
swarm-core = { path = "../swarm-core" }
swarm-adapter = { path = "../swarm-adapter" }
swarm-ipc = { path = "../swarm-ipc" }
swarm-platform = { path = "../swarm-platform" }
sha2.workspace = true
serde_json.workspace = true
serde.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
rusqlite.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }
