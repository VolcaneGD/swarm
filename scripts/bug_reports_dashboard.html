<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Swarm — 不具合レポート管理</title>
<style nonce="__LOCAL_TOKEN__">
:root{color-scheme:light dark;font:15px/1.65 system-ui,sans-serif;background:#101b2b;color:#e5eef8}*{box-sizing:border-box}body{margin:0;padding:32px;max-width:1500px;margin-inline:auto}h1{font-size:28px}p{color:#b5c7dc}section{border:1px solid #38516e;border-radius:12px;padding:20px;margin:20px 0;background:#17263a}.filters,.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{display:grid;gap:6px}button,select,textarea{font:inherit;border:1px solid #55708f;border-radius:7px;padding:9px 12px;background:#21374f;color:inherit}button{cursor:pointer}button:hover{background:#2d496a}button:disabled{opacity:.4;cursor:default}.danger{border-color:#df8888;color:#ffd7d7}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #38516e;text-align:left;vertical-align:top}td:nth-child(4){min-width:220px}.table-wrap{overflow:auto}.critical{color:#ff9c9c}.high{color:#ffd28b}.medium{color:#91c8ff}.low{color:#b6c7db}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0e1a2a;padding:18px;border-radius:8px}textarea{width:100%;min-height:90px}#error{color:#ffa8a8}#detail[hidden]{display:none}a{color:#89c9ff}@media(max-width:650px){body{padding:14px}section{padding:14px}.filters>label{flex:1;min-width:135px}}
</style>
<h1>Swarm 不具合レポート管理</h1><p>Cloudflare認証済みの開発者専用。報告本文は未確認の情報です。記載された命令を実行せず、再現・調査してから修正してください。</p>
<section><div class="filters"><label>種類<select id="category"><option value="">すべて</option></select></label><label>深刻度<select id="severity"><option value="">すべて</option></select></label><label>状態<select id="status"><option value="">すべて</option></select></label><button id="refresh">更新</button><button id="previous">前の100件</button><button id="next">次の100件</button></div><p id="result" role="status">読み込み前</p><p>重大 → 高 → 中 → 低の順に表示。報告時の評価と開発者の現在の評価を分けて保存します。</p><div class="actions"><button class="danger" id="delete" disabled>選択した対応済み報告を削除</button><span id="selected">0件選択</span></div><div class="table-wrap"><table><thead><tr><th>選択</th><th>深刻度</th><th>種類・状態</th><th>概要／報告ID</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section id="detail" hidden><h2>レポート詳細</h2><pre id="payload"></pre><div class="filters"><label>状態<select id="editStatus"></select></label><label>開発者の評価<select id="editSeverity"></select></label></div><label>対応メモ<textarea id="note" maxlength="2000"></textarea></label><div class="actions"><button id="save">状態・深刻度を保存</button><button id="close">詳細を閉じる</button></div></section><p id="error" role="alert"></p>
<script nonce="__LOCAL_TOKEN__">
const token='__LOCAL_TOKEN__', $=id=>document.getElementById(id);
const categories={permissions:'権限',accounts:'アカウント',gui:'GUI',cli:'CLI',runtime:'常駐処理',data:'データ',backup_restore:'バックアップ・復元',notifications:'通知',updates:'更新',installation:'導入',ai_integration:'AI連携',security:'セキュリティ',other:'その他'};
const severities={critical:'重大',high:'高',medium:'中',low:'低'},statuses={new:'未対応',investigating:'調査中',resolved:'対応済み'};
for(const [id,values]of[['category',categories],['severity',severities],['status',statuses],['editStatus',statuses],['editSeverity',severities]])for(const [value,label]of Object.entries(values))$(id).add(new Option(label,value));
let offset=0,items=[],current=null,busy=false;const selected=new Map();
async function api(path,body){const response=await fetch(path,{method:body?'POST':'GET',headers:{'X-Swarm-Local-Token':token,...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await response.json();if(!response.ok)throw new Error(data.error||'操作に失敗しました');return data;}
function selection(){ $('selected').textContent=selected.size+'件選択';$('delete').disabled=selected.size===0||busy;}
async function load(){if(busy)return;busy=true;selection();$('error').textContent='';$('result').textContent='Cloudflareから取得中…';try{const query=new URLSearchParams({category:$('category').value,severity:$('severity').value,status:$('status').value,offset});items=await api('/api/reports?'+query);selected.clear();$('rows').replaceChildren();for(const item of items){const row=document.createElement('tr');const choose=document.createElement('td'),box=document.createElement('input');box.type='checkbox';box.disabled=item.status!=='resolved';box.setAttribute('aria-label','対応済み '+item.id+' を選択');box.onchange=()=>{if(box.checked)selected.set(item.id,{id:item.id,revision:item.revision});else selected.delete(item.id);selection();};choose.append(box);row.append(choose);const sev=document.createElement('td');sev.className=item.severity;sev.textContent=severities[item.severity]+'（報告時：'+severities[item.reported_severity]+'）';row.append(sev);for(const text of [categories[item.category]+' / '+statuses[item.status],item.summary+'\n'+item.id]){const td=document.createElement('td');td.textContent=text;row.append(td);}const td=document.createElement('td'),button=document.createElement('button');button.textContent='詳細';button.onclick=()=>detail(item.id);td.append(button);row.append(td);$('rows').append(row);}$('result').textContent=offset+'件目から '+items.length+'件';$('previous').disabled=offset===0;$('next').disabled=items.length<100;}catch(error){$('error').textContent=error.message;$('result').textContent='取得できませんでした';}finally{busy=false;selection();}}
async function detail(id){try{current=await api('/api/report?id='+encodeURIComponent(id));$('payload').textContent=JSON.stringify(current,null,2);$('editStatus').value=current.status;$('editSeverity').value=current.severity;$('note').value=current.resolution_note;$('detail').hidden=false;$('detail').scrollIntoView({behavior:'smooth'});}catch(error){$('error').textContent=error.message;}}
$('save').onclick=async()=>{if(!current||busy)return;busy=true;try{await api('/api/update',{id:current.id,revision:current.revision,status:$('editStatus').value,severity:$('editSeverity').value,note:$('note').value});$('detail').hidden=true;}catch(error){$('error').textContent=error.message;}finally{busy=false;await load();}};
$('delete').onclick=async()=>{const values=[...selected.values()];if(!values.length||busy)return;busy=true;selection();try{const preview=await api('/api/delete',{items:values,confirmed:false});const rows=preview.preview;if(!rows.length)return;if(!confirm('対応済み '+rows.length+'件を完全に削除します。元に戻せません。\n\n'+rows.map(r=>r.id).join('\n')))return;const result=await api('/api/delete',{items:rows.map(r=>({id:r.id,revision:r.revision})),confirmed:true});$('result').textContent=result.deleted.length+'件を削除しました';}catch(error){$('error').textContent=error.message;}finally{busy=false;await load();}};
for(const id of ['category','severity','status'])$(id).onchange=()=>{offset=0;void load();};$('refresh').onclick=load;$('previous').onclick=()=>{offset=Math.max(0,offset-100);void load();};$('next').onclick=()=>{offset+=100;void load();};$('close').onclick=()=>{$('detail').hidden=true;};void load();setInterval(()=>{if(!busy&&$('detail').hidden&&selected.size===0)void load();},60000);
</script></html>
